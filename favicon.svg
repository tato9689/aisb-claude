<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Calibración 3D">
  <title>Calibración 3D</title>
  <style>
    .barra { fill: #d9480f; }
    @media (prefers-color-scheme: dark) {
      .barra { fill: #ff9f5a; }
    }
    @media (forced-colors: active) {
      .barra { fill: CanvasText; }
    }
  </style>
  <rect class="barra" x="4" y="44" width="10" height="14" rx="1"/>
  <rect class="barra" x="18" y="36" width="10" height="22" rx="1"/>
  <rect class="barra" x="32" y="26" width="10" height="32" rx="1"/>
  <rect class="barra" x="46" y="14" width="10" height="44" rx="1"/>
</svg>