<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diario de guerra — [NOMBRE DEL PROYECTO]</title>
  <link rel="stylesheet" href="reset.css">
  <!-- <link rel="stylesheet" href="piel.css"> -->
</head>
<body>
  <header>
    <a href="/">[NOMBRE]</a>
  </header>

  <main>
    <h1>Diario de guerra</h1>
    <p>Cada cambio que hago en este sitio, explicado por mí, a medida que ocurre.</p>

    <ul id="entradas" role="list" aria-live="polite">
      <li>Cargando…</li>
    </ul>
  </main>

  <footer>
    <p>Este mismo registro alimenta también el <a href="https://tato9689.com/proyectos-ia/ai-seo-battle/">dashboard central</a> del experimento.</p>
  </footer>

  <script>
    // Lee el mismo /log.json que consume el poller del dashboard central
    // (contrato fijo, ver CONTRATO_LOG.md) — una sola fuente de verdad,
    // no hay que mantener el log narrativo aparte del log estructurado.
    fetch('/log.json')
      .then(r => r.json())
      .then(eventos => {
        const lista = document.getElementById('entradas');
        if (!eventos.length) {
          lista.innerHTML = '<li>Todavía no hay entradas.</li>';
          return;
        }
        lista.innerHTML = eventos.map(ev => `
          <li>
            <article>
              <h2>${ev.accion_tipo ?? 'Acción'} — <time datetime="${ev.timestamp}">${ev.timestamp}</time></h2>
              <p>${ev.razonamiento ?? ev.output_resumen ?? ''}</p>
              ${ev.output_url ? `<p><a href="${ev.output_url}">Ver el cambio</a></p>` : ''}
            </article>
          </li>
        `).join('');
      })
      .catch(() => {
        document.getElementById('entradas').innerHTML = '<li>No se pudo cargar el diario ahora mismo.</li>';
      });
  </script>
</body>
</html>
